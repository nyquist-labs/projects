<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battery life estimator</title><style>:root{--bg:#fcfcfb;--panel:#fff;--ink:#0b0b0b;--ink2:#52514e;--muted:#8a8984;--line:#e4e3df;--acc:#2a78d6;--acc2:#eb6834}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a19;--panel:#232322;--ink:#fff;--ink2:#c3c2b7;--muted:#8f8e86;--line:#383835;--acc:#3987e5;--acc2:#f07a4a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif}
main{max-width:860px;margin:auto;padding:16px}h1{font-size:1.5em;margin:.4em 0}p.lead{color:var(--ink2);margin-top:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
label{display:grid;grid-template-columns:1fr minmax(90px,150px);gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
input,select,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
button{width:auto;cursor:pointer}button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}.big{font-size:1.6em;font-weight:650;color:var(--acc);font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:.9em}svg,canvas{max-width:100%;height:auto;display:block}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}footer{color:var(--muted);font-size:.85em;margin:24px 0}</style></head><body><main>
<h1>Battery life estimator</h1><p class="lead">Current profile → runtime, with sleep current and self-discharge.</p>
<div class="card"><label>Battery capacity (mAh)<input id="cap" type="number" value="2000"></label><label>Usable fraction (derating)<input id="der" type="number" value="0.85" step="0.05"></label>
<label>Self-discharge (% per month)<input id="sd" type="number" value="2" step="0.5"></label></div>
<div class="card"><b>Duty cycle</b><label>Wake period (s)<input id="per" type="number" value="60"></label><label>Active time (ms)<input id="act" type="number" value="20"></label>
<label>Active current (mA)<input id="ia" type="number" value="10"></label><label>Radio burst (ms)<input id="tx" type="number" value="5"></label>
<label>Radio current (mA)<input id="itx" type="number" value="40"></label><label>Sleep current (µA)<input id="isl" type="number" value="5"></label></div>
<div class="card"><p>Average current <span class="big" id="avg"></span> &nbsp; Runtime <span class="big" id="rt"></span></p><div id="bar" style="display:flex;height:22px;border-radius:6px;overflow:hidden"></div>
<p class="muted" id="leg"></p></div>
<footer>Part of Nyquist Labs by Anna Lin — the calculation code (<code>calc.js</code>) is unit-tested against independent Python references; see this project's README.</footer>
</main><script src="calc.js"></script><script>const $=id=>document.getElementById(id);
function upd(){const pr=dutyProfile(+$('per').value,+$('act').value,+$('ia').value,+$('tx').value,+$('itx').value,+$('isl').value);
const I=averageCurrent(pr),h=runtimeHours(+$('cap').value,pr,+$('der').value,+$('sd').value);$('avg').textContent=I<1?(I*1000).toFixed(2)+' µA':I.toFixed(3)+' mA';
$('rt').textContent=h>24*365?(h/24/365).toFixed(2)+' years':h>48?(h/24).toFixed(1)+' days':h.toFixed(1)+' h';const b=breakdown(pr),c=['var(--acc)','var(--acc2)','var(--muted)'],n=['active','radio','sleep'];
$('bar').innerHTML=b.map((x,i)=>`<div style="width:${x*100}%;background:${c[i]}"></div>`).join('');$('leg').innerHTML=b.map((x,i)=>`<span style="color:${c[i]}">■</span> ${n[i]} ${(x*100).toFixed(1)} %`).join(' &nbsp; ')+' of charge';}
document.querySelectorAll('input').forEach(e=>e.oninput=upd);upd();</script></body></html>
